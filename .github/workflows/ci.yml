name: CI Pipeline Python

# ¿Cuándo se va a ejecutar este pipeline?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
#Permisos del token automático de Github Actions
permissions: 
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest # El servidor virtual que usará GitHub

    steps:
    # 1. Descargar nuestro código en el servidor de GitHub
    - name: Copiar repositorio al servidor
      uses: actions/checkout@v4

    # 2. Configurar Python en el entorno virtual
    - name: Configurar versión de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instalar las dependencias del proyecto
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. (Opcional por ahora) Ejecutar pruebas o verificar sintaxis
    - name: Validar ejecución de la app
      run: |
        echo "¡El código compiló y las dependencias se instalaron con éxito!"
